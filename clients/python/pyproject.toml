[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simon-protocol"
version = "0.4.0"
description = "Client for the SIMON Protocol: one signed message to name@domain."
readme = "readme.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
crypto = ["cryptography>=40"]
dns = ["dnspython>=2.4"]

[project.scripts]
simon = "simon.cli:main"

[project.urls]
Specification = "https://github.com/agnt-ai/simon-protocol/blob/main/spec/protocol.md"
Repository = "https://github.com/agnt-ai/simon-protocol"

[tool.setuptools]
packages = ["simon"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
